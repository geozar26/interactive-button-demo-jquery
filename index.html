<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jQuery Button Toggle</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing: border-box;
 }
 
 body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 100px;
  }

  #toggleButton {
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    transition: background-color 0.3s, transform 0.2s;
  }

 
  #toggleButton:hover {
    background-color: #2980b9;
    transform: scale(1.05);
  }

  #myText {
    display: none; 
    margin-top: 40px;
    font-size: 36px;
    color: #e74c3c;
  }
</style>


<button id="toggleButton">Πατήστε με!</button>
<h1 id="myText">Γεια σου κόσμε!</h1>

<script>
  $(document).ready(function(){
    $('#toggleButton').click(function(){
      $('#myText').fadeToggle(300); 
    });
  });
</script>

</body>
</html>
